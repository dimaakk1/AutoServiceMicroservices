syntax = "proto3";

message OrderRequest {
    int32 orderId = 1;
}

message OrderFilterRequest {
    string userId = 1;
    string status = 2;
    string date = 3;
    string fromDate = 4;
    string toDate = 5;
    int32 offset = 6;
    int32 limit = 7;
}

// =====================
// RESPONSE MODELS
// =====================

message OrderItemResponse {
    int32 orderItemId = 1;
    int32 productId = 2;
    string productName = 3;
    double price = 4;
    int32 quantity = 5;
    double totalPrice = 6;
}

message OrderResponse {
    int32 orderId = 1;
    string userId = 2;        //  ЗАМІСТЬ customerId
    string status = 3;
    string orderDate = 4;

    repeated OrderItemResponse items = 5;
    string vehicleId = 6;
    string vehicleDisplayName = 7;
    string vehicleVin = 8;
    string vehicleLicensePlate = 9;
    string mechanicId = 10;
    string mechanicName = 11;
    string workStartedAt = 12;
    string workCompletedAt = 13;
    string plannedCompletionAt = 14;
}

message OrderListResponse {
    repeated OrderResponse orders = 1;
}

message UpdateOrderStatusRequest {
    int32 orderId = 1;
    string status = 2;
}

message UpdateOrderStatusResponse {
    bool success = 1;
    string message = 2;
}
// =====================
// SERVICE
// =====================

service OrderService {
    rpc GetOrder (OrderRequest) returns (OrderResponse);
    rpc GetAllOrders (OrderFilterRequest) returns (OrderListResponse);
    rpc UpdateOrderStatus
    (
        UpdateOrderStatusRequest
    )
    returns
    (
        UpdateOrderStatusResponse
    );
}
